<ion-header class="topHeader">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-icon
        name="arrow-back-circle-outline"
        (click)="closeModal()"
      ></ion-icon>
    </ion-buttons>

    <ion-title class="absolute-title"> Usuarios: {{ coreName }} </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list
    *ngFor="let item of users; let i = index;"
    class="accordion-list"
    lines="none"
    detail="false"
    no-padding
  >
    <ion-item
      tappable
      (click)="toggleSection(i)"
      [ngClass]="{'section-expired' :
      item.expired || !item.enable, 'section' : !item.expired}"
    >
      <ion-icon
        class="lock"
        slot="start"
        name="lock-closed-outline"
        *ngIf="item.locked"
      ></ion-icon>
      <ion-icon
        slot="end"
        name="chevron-forward-outline"
        *ngIf="!item.open"
      ></ion-icon>
      <ion-icon
        slot="end"
        name="chevron-down-outline"
        *ngIf="item.open"
      ></ion-icon>
      <ion-label class="ion-text-wrap"
        >{{item.name}}, house: {{item.house}}</ion-label
      >
    </ion-item>

    <form tappable *ngIf="item.open" class="detail">
      <ion-item class="detail-item">
        <ion-label> User name: {{item.username}}</ion-label>
      </ion-item>
      <ion-item class="detail-item">
        <ion-label> Email: {{item.email}}</ion-label>
      </ion-item>

      <ion-item class="detail-item">
        <ion-label> Sim: {{item.sim}}</ion-label>
        <ion-icon
          *ngIf="soyAdmin || soyNeighborAdmin"
          slot="end"
          name="create-outline"
          (click)="onEditSim()"
        >
        </ion-icon>
      </ion-item>

      <form
        tappable
        *ngIf="editSim && (soyAdmin || soyNeighborAdmin)"
        class="detailRoutines"
      >
        <ion-item class="detail-item">
          <ion-input
            name="sim"
            required
            placeholder="new Sim"
            value="{{item.sim}}"
            [(ngModel)]="sim"
          ></ion-input>
          <ion-icon
            name="save-outline"
            size="large"
            *ngIf="sim"
            (click)="simChange(item.id,item.sim)"
          ></ion-icon>
        </ion-item>
      </form>

      <ion-item class="detail-item"
        >Roles:
        <ul *ngFor="let role of item.roles">
          <li>{{role}}</li>
        </ul>
        <ion-icon
          *ngIf="soyAdmin"
          slot="end"
          name="create-outline"
          (click)="onEditRole()"
        >
        </ion-icon>
      </ion-item>

      <ion-item *ngIf="editRole && soyAdmin" mode="ios">
        <ion-select
          ok-text="Seleccionar"
          placeholder="Select Event"
          (ionChange)="changeRoles($event,item.id,item.name)"
          label="Roles:"
          cancel-text="Cancelar"
          [multiple]="true"
        >
          <ion-select-option *ngFor="let item of RoleList" value="{{item.id}}"
            >{{item.name}}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item class="detail-item">
        <ion-label> Location: {{item.location}}</ion-label>
      </ion-item>

      <ion-item class="options">
        <div class="option_child">
          <ion-toggle
            id="disableToggle"
            labelPlacement="start"
            [checked]="item.blocked === 1"
            (ionChange)="chgItem($event,'blocked',item.id, item.sim,
              item.name, item.house, item.coreSim)"
          >
            <ion-label id="lblUnlock" *ngIf="item.locked"
              >Desbloquear :
            </ion-label>
            <ion-label id="lblLock" *ngIf="!item.locked">Bloquear : </ion-label>
          </ion-toggle>
        </div>
        <div class="option_child borrar" style="border-left: 2px solid white">
          <div class="borrar_child">
            <ion-label slot="start">Borrar</ion-label>
          </div>
          <div class="borrar_child">
            <ion-icon
              name="trash-outline"
              size="large"
              slot="end"
              (click)="delUser(item.id, item.name, item.coreSim)"
            ></ion-icon>
          </div>
        </div>
      </ion-item>
    </form>
  </ion-list>
</ion-content>
